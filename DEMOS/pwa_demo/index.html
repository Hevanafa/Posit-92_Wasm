<!DOCTYPE html>
<html>
<head>
  <title>POSIT-92 + WebAssembly</title>

  <link rel="stylesheet" href="posit-92.css" />

  <!-- Required for PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
</head>
<body>
  <div id="loading-overlay">
    <img src="assets/posit-92_64px.png" alt="Posit-92 logo" />
    <div>Now loading...</div>
  </div>

  <div id="play-overlay">
    <button class="animated" onclick="Play()">
      <img src="assets/btn_play.png" alt="Posit-92 play button" />
    </button>
  </div>

  <script src="posit-92.js"></script>
  <script src="p92-bmfont.mixin.js"></script>
  <script src="p92-sound.mixin.js"></script>
  <script src="game.js"></script>

  <script>
// Load Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("Posit-92 service worker registered!"));
}
